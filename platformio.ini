[platformio]
default_envs = wio_terminal_sim

[env]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
monitor_speed = 115200
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=240
  -D TFT_MISO=PIN_SPI_MISO
  -D TFT_MOSI=PIN_SPI_MOSI
  -D TFT_SCLK=PIN_SPI_SCK
  -D TFT_CS=LCD_SS_PIN
  -D TFT_DC=LCD_DC
  -D TFT_RST=LCD_RESET
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
lib_deps =
  bodmer/TFT_eSPI@^2.5.43

[env:wio_terminal_sim]
; Open-source, ready-to-flash demo mode.
; Press A to simulate a valid paid RFID card. Press B to simulate invalid card.
build_flags =
  ${env.build_flags}
  -DUSE_SIMULATED_CARD=1
  -DUSE_STS3215=0

[env:wio_terminal_sts3215]
; Hardware mode for STS3215/SCServo installations.
; Add the open-source SCServo library to lib/SCServo or install it manually.
build_flags =
  ${env.build_flags}
  -DUSE_SIMULATED_CARD=1
  -DUSE_STS3215=1

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Wio Terminal vending machine system architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:2;rx:14}.small{font:16px sans-serif;fill:#222}.title{font:700 24px sans-serif;fill:#111}.note{font:13px sans-serif;fill:#555}.wire{stroke:#333;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#f7f7f2"/>
  <text x="40" y="52" class="title">Open Wio Terminal Vending Machine Architecture</text>
  <rect x="55" y="120" width="210" height="120" class="box"/><text x="82" y="166" class="small">RFID / NFC Card</text><text x="82" y="196" class="note">Payload: TRUE token</text>
  <rect x="55" y="330" width="210" height="120" class="box"/><text x="82" y="376" class="small">PC / Operator UI</text><text x="82" y="406" class="note">Optional order writer</text>
  <rect x="405" y="175" width="260" height="170" class="box"/><text x="448" y="222" class="small">Wio Terminal</text><text x="448" y="252" class="note">State machine + LCD UI</text><text x="448" y="278" class="note">Buttons for simulation</text><text x="448" y="304" class="note">Grove I2C + UART</text>
  <rect x="810" y="95" width="220" height="110" class="box"/><text x="848" y="140" class="small">Grove RFID</text><text x="848" y="170" class="note">I2C reader</text>
  <rect x="810" y="250" width="220" height="110" class="box"/><text x="848" y="295" class="small">STS3215 Servo</text><text x="848" y="325" class="note">Serial bus gate</text>
  <rect x="810" y="405" width="220" height="110" class="box"/><text x="848" y="450" class="small">Product Column</text><text x="848" y="480" class="note">Gravity feed + chute</text>
  <path d="M265 180 C335 180 335 215 405 215" class="wire"/><text x="295" y="164" class="note">tap card</text>
  <path d="M665 215 C730 190 745 150 810 150" class="wire"/><text x="690" y="170" class="note">I2C read</text>
  <path d="M665 285 C730 290 745 305 810 305" class="wire"/><text x="690" y="278" class="note">UART command</text>
  <path d="M920 360 L920 405" class="wire"/><text x="935" y="388" class="note">open gate</text>
  <path d="M265 390 C335 390 335 305 405 305" class="wire dash"/><text x="295" y="344" class="note">optional TRUE token write</text>
</svg>

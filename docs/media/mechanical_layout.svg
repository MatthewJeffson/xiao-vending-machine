<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Mechanical layout for Wio Terminal vending machine">
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker><style>.line{stroke:#222;stroke-width:3;fill:none}.thin{stroke:#555;stroke-width:2;fill:none}.label{font:16px sans-serif;fill:#111}.title{font:700 24px sans-serif}.part{fill:#fff;stroke:#222;stroke-width:3}.window{fill:#dff3ff;stroke:#222;stroke-width:3}.petg{fill:#f7f7f7;stroke:#222;stroke-width:3}.arrow{stroke:#222;stroke-width:3;fill:none;marker-end:url(#arr)}</style></defs>
  <rect width="1000" height="620" fill="#fbfaf4"/><text x="42" y="48" class="title">Mechanical Layout: Two-Section Modular Vending Machine</text>
  <rect x="320" y="90" width="360" height="245" class="part"/><rect x="355" y="120" width="290" height="150" class="window"/><text x="415" y="200" class="label">Acrylic inventory window</text><rect x="455" y="280" width="90" height="48" class="petg"/><text x="382" y="365" class="label">Upper section: stock column + servo gate</text>
  <rect x="290" y="335" width="420" height="205" class="part"/><rect x="330" y="385" width="100" height="80" class="window"/><text x="335" y="430" class="label">Wio</text><rect x="330" y="475" width="100" height="36" class="petg"/><text x="332" y="499" class="label">RFID tap</text><path d="M540 385 L665 385 L665 465 L595 500 L540 500 Z" class="petg"/><text x="550" y="445" class="label">retrieval chute</text><text x="370" y="570" class="label">Bottom section: controller, RFID, ramp, cable management</text>
  <path d="M500 280 L500 500" class="arrow"/><text x="515" y="392" class="label">product drop path</text><path d="M665 420 C750 420 780 370 785 315" class="arrow"/><text x="720" y="392" class="label">servo arm pushes one item</text><circle cx="790" cy="300" r="30" fill="#eee" stroke="#222" stroke-width="3"/><text x="745" y="260" class="label">servo</text>
</svg>
